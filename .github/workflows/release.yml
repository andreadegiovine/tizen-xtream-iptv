name: Release

# Runs when a GitHub release is published. The release tag must be a plain semantic version
# (v1.2.3 or 1.2.3) because Tizen widget versions only accept numeric x.y.z.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate tag and derive version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or 1.2.3 (Tizen needs numeric x.y.z)."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Stamp version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Package build output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          (cd dist && zip -r "../release/xtream-iptv-${VERSION}.zip" .)
          (cd release && sha256sum "xtream-iptv-${VERSION}.zip" > "xtream-iptv-${VERSION}.zip.sha256")

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber
