name: Release

# Runs when a GitHub release is published: one job checks the code, then one job per platform builds its package and attaches it
# to the release. Everything a platform needs (manifest, certificate, packaging script) is in platforms/<name>/; the app code is the
# same for all. The release tag must be a plain semantic version (v1.2.3 or 1.2.3): Tizen widget versions only accept numeric x.y.z.
#
# Assets attached to the release:
#   - xtream-iptv-<version>.wgt         Samsung Tizen, signed production widget   (+ .sha256)
#   (next: LG webOS .ipk, then Android / Fire TV .apk — see docs/MULTIPLATFORM.md)
#
# Secrets: TIZEN_CERT_PASSWORD (password of platforms/tizen/tizencert.p12).
# TMDB and Trakt keys are not part of the build: they are typed in the app Settings.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate tag and derive version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or 1.2.3 (Tizen needs numeric x.y.z)."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # One job per platform, all after `verify`: a platform that fails does not stop the others.
  tizen:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Production build for Tizen -> dist/.
      - run: npm run build:tizen

      - name: Sign the widget
        env:
          CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
        run: bash platforms/tizen/package.sh "$VERSION" release

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber
