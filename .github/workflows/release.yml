name: Release

# Runs when a GitHub release is published: one job checks the code, then one job per platform builds its package and attaches it
# to the release. Everything a platform needs (manifest, certificate, packaging script) is in platforms/<name>/; the app code is the
# same for all. The release tag must be a plain semantic version (v1.2.3 or 1.2.3): Tizen widget versions only accept numeric x.y.z.
#
# Assets attached to the release, named xtream-iptv-<version>_<platform>.<ext>:
#   - xtream-iptv-<version>_tizen.wgt   Samsung Tizen, signed widget for the store (no trailer service, no online updates) (+ .sha256)
#     _tizen_youtube.wgt (trailers in the app), _tizen_autoupdate.wgt, _tizen_youtube_autoupdate.wgt (update themselves)
#   - xtream-iptv-<version>_webos.ipk   LG webOS (+ .sha256); _webos_autoupdate.ipk updates itself
#   - xtream-iptv-<version>_windows-x64.exe, _macos-x64.dmg, _macos-arm64.dmg, _linux-x64.AppImage, _linux-x64.deb
#                                       desktop app (Electron), not signed; each also as _autoupdate (e.g. _windows-x64_autoupdate.exe) (+ .sha256)
#   - xtream-iptv-<version>_androidtv.apk, _firetv.apk; _androidtv_autoupdate.apk, _firetv_autoupdate.apk update themselves
#                                       Android TV / Fire TV (Capacitor + ExoPlayer)  (+ .sha256)
#
# Secrets: TIZEN_CERT_PASSWORD (password of platforms/tizen/tizencert.p12); ANDROID_KEYSTORE_PASSWORD (and optionally ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD) for platforms/android/release.keystore — without them the APKs are signed with a debug key.
# TMDB and Trakt keys are not part of the build: they are typed in the app Settings.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and derive version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or 1.2.3 (Tizen needs numeric x.y.z)."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # One job per platform, all after `verify`: a platform that fails does not stop the others.
  tizen:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Four widgets: _tizen (store: no trailer service, no online updates), _tizen_youtube (trailers in the app), and the same two
      # with _autoupdate (they update themselves from the online build of the same variant).
      - name: Build and sign the widgets
        env:
          CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
        run: |
          for variant in "" "_youtube" "_autoupdate" "_youtube_autoupdate"; do
            flags=""
            case "$variant" in *youtube*) flags="$flags --env youtube" ;; esac
            case "$variant" in *autoupdate*) flags="$flags --env autoupdate" ;; esac
            npx webpack --mode production --env platform=tizen $flags
            node scripts/check-dist.js
            VARIANT="$variant" bash platforms/tizen/package.sh "$VERSION" release
          done

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  webos:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Two packages: _webos (store: no online updates) and _webos_autoupdate (updates itself from the online build).
      - name: Build and package the apps
        run: |
          for variant in "" "_autoupdate"; do
            flags=""
            case "$variant" in *autoupdate*) flags="--env autoupdate" ;; esac
            npx webpack --mode production --env platform=webos $flags
            node scripts/check-dist.js
            VARIANT="$variant" bash platforms/webos/package.sh "$VERSION" release
          done

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  # The desktop app, each system on its own machine (electron-builder makes the installer of the system it runs on).
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            runner: ubuntu-latest
          - system: windows
            runner: windows-latest
          - system: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Two packages per system, each from its own production build -> dist/: the plain one and _autoupdate (it updates its web code
      # itself from the online "desktop" build; a new Electron still needs a new package).
      - name: Package the app
        run: |
          for variant in "" "_autoupdate"; do
            flags="--env platform=desktop"
            case "$variant" in *autoupdate*) flags="$flags --env autoupdate" ;; esac
            npx webpack --mode production $flags
            node scripts/check-dist.js
            VARIANT="$variant" bash platforms/desktop/package.sh "$VERSION" release "${{ matrix.system }}"
          done

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Two sets of APKs, each from its own production build -> dist/ (with the launcher icons and the banner in dist/android-res/):
      # _androidtv / _firetv (no online updates, for the stores) and _androidtv_autoupdate / _firetv_autoupdate (they update their web
      # code themselves from the online "android" build; native changes still need a new APK).
      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variant in "" "_autoupdate"; do
            flags="--env platform=android"
            case "$variant" in *autoupdate*) flags="$flags --env autoupdate" ;; esac
            npx webpack --mode production $flags
            node scripts/check-dist.js
            VARIANT="$variant" bash platforms/android/package.sh "$VERSION" release all
          done

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  # Updates from the app itself (src/services/updates.js): the web code of every platform's build goes to the gh-pages branch, served by
  # GitHub Pages, with version.json pointing at it. Installed apps find it at their next start. Raise `updates.minShell` in package.json
  # when a release changes the native parts (config.xml privileges, Android plugins, Electron): older packages are then asked to reinstall.
  pages:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # One online build per "_autoupdate" variant (channel): the package follows the build of its own variant.
      - name: Build the web code of every update channel
        run: |
          npx webpack --mode production --env platform=tizen --env autoupdate --output-path builds/tizen
          npx webpack --mode production --env platform=tizen --env youtube --env autoupdate --output-path builds/tizen_youtube
          npx webpack --mode production --env platform=webos --env autoupdate --output-path builds/webos
          npx webpack --mode production --env platform=android --env autoupdate --output-path builds/android
          npx webpack --mode production --env platform=desktop --env autoupdate --output-path builds/desktop

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish the builds and version.json
        run: |
          node scripts/publish-updates.js pages "$VERSION" tizen=builds/tizen tizen_youtube=builds/tizen_youtube webos=builds/webos android=builds/android desktop=builds/desktop
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Online update $VERSION"
          git push
