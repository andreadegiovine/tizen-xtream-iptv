apply plugin: 'com.android.application'

android {
    namespace = "com.xtrmiptv.tv"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xtrmiptv.tv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // From the release tag (platforms/android/package.sh): x.y.z → versionName x.y.z, versionCode x*10000 + y*100 + z.
        versionCode((project.findProperty('xtreamVersionCode') ?: '1') as Integer)
        versionName((project.findProperty('xtreamVersionName') ?: '0.0.0') as String)
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true // BuildConfig.FLAVOR, read by TvHostPlugin
    }
    // Two packages from the same code: Android TV (Leanback required) and Fire TV (src/<flavor>/AndroidManifest.xml).
    flavorDimensions = ["device"]
    productFlavors {
        androidtv {
            dimension "device"
        }
        firetv {
            dimension "device"
        }
    }
    // Release signing: platforms/android/release.keystore with its passwords from the environment (GitHub secrets). Without them the
    // release is signed with the debug key (installable, but a later version signed otherwise does not update it).
    def releaseKeystore = rootProject.file('../release.keystore')
    def releasePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def canSign = releaseKeystore.exists() && releasePassword
    signingConfigs {
        release {
            if (canSign) {
                storeFile releaseKeystore
                storePassword releasePassword
                keyAlias(System.getenv('ANDROID_KEY_ALIAS') ?: 'xtream')
                keyPassword(System.getenv('ANDROID_KEY_PASSWORD') ?: releasePassword)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig(canSign ? signingConfigs.release : signingConfigs.debug)
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Video: ExoPlayer (MPEG-TS, HLS, MKV, MP4), drawn by a PlayerView behind the WebView (ExoPlayerPlugin).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
